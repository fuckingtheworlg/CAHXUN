<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园墙管理后台</title>
<style>
:root {
  --bg: #f0f2f5;
  --sidebar-bg: #1a1d23;
  --sidebar-active: #2d6cdf;
  --card-bg: #fff;
  --text: #1f2937;
  --text-secondary: #6b7280;
  --border: #e5e7eb;
  --accent: #2d6cdf;
  --accent-light: #e8f0fe;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #f59e0b;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* ─── Login ─── */
.login-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #1a1d23 0%, #2d3748 100%);
}

.login-card {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 48px 40px;
  width: 400px;
  max-width: 90vw;
  box-shadow: var(--shadow-lg);
}

.login-card h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; }
.login-card .subtitle { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }

.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--text); }

.form-group input, .form-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
}

.form-group input:focus, .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }

.form-textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
  resize: vertical;
  min-height: 120px;
  font-family: inherit;
  line-height: 1.6;
}

.form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
}

.btn-primary { background: var(--accent); color: #fff; width: 100%; padding: 12px; }
.btn-primary:hover { background: #2558b3; }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }

.btn-accent {
  background: var(--accent);
  color: #fff;
  padding: 8px 18px;
  font-size: 13px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: 500;
  transition: background .15s;
}

.btn-accent:hover { background: #2558b3; }

.btn-danger-sm {
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--danger);
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 500;
  transition: all .15s;
}

.btn-danger-sm:hover { background: var(--danger); color: #fff; }

.btn-danger-solid {
  background: var(--danger);
  color: #fff;
  padding: 8px 18px;
  border-radius: 6px;
  border: none;
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
  transition: background .15s;
}

.btn-danger-solid:hover { background: #dc2626; }

.login-error { color: var(--danger); font-size: 13px; text-align: center; margin-top: 12px; min-height: 20px; }

/* ─── Layout ─── */
.layout { display: flex; min-height: 100vh; }

.sidebar {
  width: 220px;
  background: var(--sidebar-bg);
  color: #a1a7b3;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
}

.sidebar-brand { padding: 24px 20px 20px; font-size: 18px; font-weight: 700; color: #fff; letter-spacing: .5px; }
.sidebar-brand span { color: var(--accent); }
.sidebar-nav { flex: 1; padding: 8px 12px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  transition: all .15s;
  margin-bottom: 2px;
  user-select: none;
}

.nav-item:hover { background: rgba(255,255,255,.06); color: #d1d5db; }
.nav-item.active { background: var(--sidebar-active); color: #fff; }
.nav-icon { width: 20px; text-align: center; font-size: 16px; flex-shrink: 0; }

.sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.08); }

.logout-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #a1a7b3;
  font-size: 13px;
  cursor: pointer;
  padding: 6px 0;
  transition: color .2s;
}

.logout-btn:hover { color: var(--danger); }

.main-content { margin-left: 220px; flex: 1; min-height: 100vh; }

.topbar {
  height: 60px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 32px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.topbar-title { font-size: 16px; font-weight: 600; }

.content-area { padding: 24px 32px; }

/* ─── System monitor ─── */
.sys-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px; }
.sys-card { background: var(--card-bg); border-radius: var(--radius); padding: 18px 22px; box-shadow: var(--shadow); }
.sys-card-title { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; font-weight: 500; }
.sys-card-meta { font-size: 11px; font-weight: 600; color: var(--accent); }
.sys-card-value { font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 8px; line-height: 1.1; }
.sys-card-sub { font-size: 12px; color: var(--text-secondary); }
.sys-progress { width: 100%; height: 6px; background: #f0f1f3; border-radius: 3px; overflow: hidden; margin-top: 10px; }
.sys-progress-bar { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
.sys-progress-bar.green { background: linear-gradient(90deg, #22c55e, #4ade80); }
.sys-progress-bar.yellow { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.sys-progress-bar.red { background: linear-gradient(90deg, #ef4444, #f87171); }
.sys-progress-bar.blue { background: linear-gradient(90deg, #2d6cdf, #60a5fa); }

/* ─── Section title ─── */
.section-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-title-row h4 { font-size: 14px; font-weight: 600; color: var(--text); }
.section-title-row .auto-refresh { font-size: 12px; color: var(--text-secondary); }

/* ─── Stats ─── */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 28px; }

.stat-card { background: var(--card-bg); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
.stat-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
.stat-value { font-size: 32px; font-weight: 700; color: var(--text); line-height: 1.2; }

.stat-card:nth-child(1) .stat-value { color: var(--accent); }
.stat-card:nth-child(2) .stat-value { color: var(--success); }
.stat-card:nth-child(3) .stat-value { color: var(--warning); }
.stat-card:nth-child(4) .stat-value { color: #8b5cf6; }

/* ─── Card & Table ─── */
.card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
  flex-wrap: wrap;
}

.card-header h3 { font-size: 15px; font-weight: 600; }

.card-header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.search-box { display: flex; align-items: center; gap: 8px; }

.search-box input {
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  width: 220px;
  outline: none;
  transition: border-color .2s;
}

.search-box input:focus { border-color: var(--accent); }

.search-box .btn-sm, .btn-sm {
  padding: 7px 14px;
  font-size: 13px;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  font-weight: 500;
}

.btn-sm:hover { background: #2558b3; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }

thead th {
  text-align: left;
  padding: 12px 16px;
  background: #f9fafb;
  font-weight: 600;
  color: var(--text-secondary);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .4px;
  border-bottom: 1px solid var(--border);
}

tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:hover { background: #f9fafb; }

.text-wrap-cell {
  max-width: 400px;
  line-height: 1.5;
  word-break: break-all;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-blue { background: var(--accent-light); color: var(--accent); }
.badge-green { background: #dcfce7; color: #16a34a; }

.action-links { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.action-links a { cursor: pointer; font-weight: 500; font-size: 13px; text-decoration: none; }
.action-link-primary { color: var(--accent); }
.action-link-primary:hover { text-decoration: underline; }
.action-link-danger { color: var(--danger); }
.action-link-danger:hover { text-decoration: underline; }

/* ─── Checkbox ─── */
.row-checkbox {
  width: 16px;
  height: 16px;
  cursor: pointer;
  accent-color: var(--accent);
}

/* ─── Pagination ─── */
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  color: var(--text-secondary);
}

.pagination-btns { display: flex; gap: 6px; }

.pagination-btns button {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
}

.pagination-btns button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pagination-btns button:disabled { opacity: .4; cursor: not-allowed; }

/* ─── Settings ─── */
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

.setting-item {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px 24px;
  box-shadow: var(--shadow);
}

.setting-item .label {
  font-size: 12px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: .4px;
  margin-bottom: 6px;
}

.setting-item .value-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.setting-item .value { font-size: 15px; font-weight: 600; word-break: break-all; flex: 1; }

.setting-edit-btn {
  padding: 4px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  font-size: 12px;
  cursor: pointer;
  color: var(--accent);
  font-weight: 500;
  flex-shrink: 0;
  transition: all .15s;
}

.setting-edit-btn:hover { background: var(--accent-light); border-color: var(--accent); }

.setting-edit-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.setting-edit-row input {
  flex: 1;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  outline: none;
}
.setting-edit-row input:focus { border-color: var(--accent); }

.setting-save-btn {
  padding: 7px 14px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 500;
}

.setting-cancel-btn {
  padding: 7px 14px;
  background: #fff;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}

.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-dot.green { background: var(--success); }
.status-dot.red { background: var(--danger); }

/* ─── Import ─── */
.import-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 60px 40px;
  text-align: center;
  background: var(--card-bg);
  transition: all .2s;
  cursor: pointer;
  position: relative;
}

.import-zone:hover, .import-zone.dragover { border-color: var(--accent); background: var(--accent-light); }
.import-zone .zone-icon { font-size: 48px; margin-bottom: 16px; }
.import-zone .zone-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
.import-zone .zone-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
.import-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.import-actions { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }

.btn-outline {
  padding: 8px 20px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  color: var(--text);
}

.btn-outline:hover { border-color: var(--accent); color: var(--accent); }

.import-result { background: var(--card-bg); border-radius: var(--radius); padding: 24px; margin-top: 20px; box-shadow: var(--shadow); }
.import-result h4 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.result-stats { display: flex; gap: 24px; margin-bottom: 16px; }
.result-stat { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.result-stat .count { font-weight: 700; font-size: 20px; }
.result-stat .count.green { color: var(--success); }
.result-stat .count.red { color: var(--danger); }

.error-list {
  background: #fef2f2;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  color: #991b1b;
  max-height: 200px;
  overflow-y: auto;
  line-height: 1.8;
}

.import-help { background: var(--card-bg); border-radius: var(--radius); padding: 24px; margin-top: 20px; box-shadow: var(--shadow); }
.import-help h4 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.import-help table { font-size: 13px; }
.import-help td { padding: 8px 12px; }
.import-help .col-name { font-weight: 600; white-space: nowrap; }
.import-help .col-required { color: var(--danger); font-weight: 600; }
.import-help .col-optional { color: var(--text-secondary); }

.file-selected { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: var(--accent-light); border-radius: 8px; margin-top: 16px; }
.file-selected .file-name { font-weight: 600; font-size: 14px; flex: 1; }
.file-selected .file-size { font-size: 12px; color: var(--text-secondary); }
.file-selected .file-remove { cursor: pointer; color: var(--text-secondary); font-size: 16px; }
.file-selected .file-remove:hover { color: var(--danger); }

.btn-upload {
  padding: 10px 32px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
  margin-top: 16px;
}

.btn-upload:hover { background: #2558b3; }
.btn-upload:disabled { opacity: .6; cursor: not-allowed; }

/* ─── Modal ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
}

.modal {
  background: var(--card-bg);
  border-radius: 16px;
  width: 640px;
  max-width: 90vw;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.modal-header h3 { font-size: 16px; font-weight: 600; }

.modal-close {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: none;
  background: #f3f4f6;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
}

.modal-close:hover { background: #e5e7eb; }

.modal-body { padding: 24px; overflow-y: auto; flex: 1; }

.modal-body .post-content { font-size: 14px; line-height: 1.8; white-space: pre-wrap; word-break: break-all; margin-bottom: 16px; }
.modal-body .post-images { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.modal-body .post-images img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; cursor: pointer; }
.modal-body .post-meta { font-size: 13px; color: var(--text-secondary); }

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  flex-shrink: 0;
}

.modal-footer .btn-cancel {
  padding: 9px 22px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
}

.modal-footer .btn-cancel:hover { border-color: var(--accent); color: var(--accent); }

.modal-footer .btn-save {
  padding: 9px 22px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
}

.modal-footer .btn-save:hover { background: #2558b3; }
.modal-footer .btn-save:disabled { opacity: .6; cursor: not-allowed; }

.form-field { margin-bottom: 18px; }
.form-field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
.form-field .hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* ─── Toast ─── */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; }

.toast {
  padding: 12px 24px;
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: toastSlide .3s ease;
  max-width: 360px;
}

.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.warning { background: var(--warning); color: var(--text); }

@keyframes toastSlide { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

/* ─── Responsive ─── */
@media (max-width: 768px) {
  .sidebar { width: 60px; }
  .sidebar-brand, .nav-item span, .sidebar-footer span { display: none; }
  .nav-item { justify-content: center; padding: 12px; }
  .main-content { margin-left: 60px; }
  .content-area { padding: 16px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}

.hidden { display: none !important; }

.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .6s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.page-loading { display: flex; align-items: center; justify-content: center; padding: 80px 0; gap: 10px; color: var(--text-secondary); font-size: 14px; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginView" class="login-wrapper">
  <div class="login-card">
    <h1>校园墙管理</h1>
    <p class="subtitle">管理后台登录</p>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPass" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appView" class="layout hidden">
  <aside class="sidebar">
    <div class="sidebar-brand"><span>校园墙</span> 管理</div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
        <div class="nav-icon">📊</div><span>仪表盘</span>
      </div>
      <div class="nav-item" data-page="posts" onclick="navigate('posts')">
        <div class="nav-icon">📝</div><span>贴文管理</span>
      </div>
      <div class="nav-item" data-page="users" onclick="navigate('users')">
        <div class="nav-icon">👥</div><span>用户管理</span>
      </div>
      <div class="nav-item" data-page="chatlogs" onclick="navigate('chatlogs')">
        <div class="nav-icon">💬</div><span>问答日志</span>
      </div>
      <div class="nav-item" data-page="import" onclick="navigate('import')">
        <div class="nav-icon">📥</div><span>数据导入</span>
      </div>
      <div class="nav-item" data-page="settings" onclick="navigate('settings')">
        <div class="nav-icon">⚙️</div><span>系统设置</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="logout-btn" onclick="doLogout()">
        <span>退出登录</span>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-title" id="pageTitle">仪表盘</div>
    </div>
    <div class="content-area" id="contentArea"></div>
  </main>
</div>

<!-- ============ Modal ============ -->
<div id="modalOverlay" class="modal-overlay hidden" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modalTitle">贴文详情</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer hidden" id="modalFooter">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" id="modalSaveBtn" onclick="handleModalSave()">保存</button>
    </div>
  </div>
</div>

<!-- ============ Toast container ============ -->
<div class="toast-container" id="toastContainer"></div>

<script>
/* ─────── State ─────── */
const API_BASE = location.origin + '/api';
let adminToken = localStorage.getItem('admin_token') || '';
let currentPage = 'dashboard';
let selectedPostIds = new Set();
let modalMode = '';   // 'view', 'create', 'edit'
let editingPostId = null;

const pageTitles = {
  dashboard: '仪表盘',
  posts: '贴文管理',
  users: '用户管理',
  chatlogs: '问答日志',
  import: '数据导入',
  settings: '系统设置',
};

/* ─────── Init ─────── */
window.addEventListener('DOMContentLoaded', () => {
  if (adminToken) {
    showApp();
    navigate('dashboard');
  }
  document.getElementById('loginPass').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });
});

/* ─────── Toast ─────── */
function showToast(msg, type) {
  type = type || 'success';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2500);
}

/* ─────── Auth ─────── */
async function doLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  if (!user || !pass) { errEl.textContent = '请输入用户名和密码'; return; }

  btn.disabled = true;
  btn.textContent = '登录中...';
  errEl.textContent = '';

  try {
    const res = await fetch(API_BASE + '/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '登录失败');

    adminToken = data.token;
    localStorage.setItem('admin_token', adminToken);
    showApp();
    navigate('dashboard');
  } catch (e) {
    errEl.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

function doLogout() {
  adminToken = '';
  localStorage.removeItem('admin_token');
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginError').textContent = '';
}

function showApp() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
}

async function api(path, opts) {
  opts = opts || {};
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + adminToken, ...(opts.headers || {}) },
  });
  if (res.status === 401) { doLogout(); throw new Error('认证过期'); }
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || '请求失败');
  return data;
}

/* ─────── Router ─────── */
function navigate(page) {
  currentPage = page;
  document.getElementById('pageTitle').textContent = pageTitles[page] || '';
  document.querySelectorAll('.nav-item').forEach((el) => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  renderPage();
}

function renderPage() {
  const area = document.getElementById('contentArea');
  area.innerHTML = '<div class="page-loading"><div class="spinner"></div> 加载中...</div>';
  switch (currentPage) {
    case 'dashboard': renderDashboard(); break;
    case 'posts': renderPosts(1); break;
    case 'users': renderUsers(1); break;
    case 'chatlogs': renderChatLogs(1); break;
    case 'import': renderImport(); break;
    case 'settings': renderSettings(); break;
  }
}

/* ─────── Modal helpers ─────── */
function openModal(title, bodyHtml, mode, showFooter) {
  modalMode = mode || 'view';
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  const footer = document.getElementById('modalFooter');
  if (showFooter) footer.classList.remove('hidden');
  else footer.classList.add('hidden');
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.add('hidden');
  modalMode = '';
  editingPostId = null;
}

function handleModalSave() {
  if (modalMode === 'create') saveNewPost();
  else if (modalMode === 'edit') saveEditPost();
}

/* ─────── Dashboard ─────── */
let _sysTimer = null;

async function renderDashboard() {
  const area = document.getElementById('contentArea');
  try {
    const s = await api('/admin/stats');
    area.innerHTML =
      '<div class="section-title-row"><h4>业务统计</h4></div>' +
      '<div class="stats-grid">' +
        '<div class="stat-card"><div class="stat-label">注册用户</div><div class="stat-value">' + num(s.total_users || 0) + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">贴文总数</div><div class="stat-value">' + num(s.total_posts) + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">今日新增贴文</div><div class="stat-value">' + num(s.today_posts) + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">今日 AI 问答</div><div class="stat-value">' + num(s.today_chats) + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">活跃会话</div><div class="stat-value">' + num(s.active_sessions) + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">封禁用户</div><div class="stat-value" style="color:var(--danger)">' + num(s.banned_users || 0) + '</div></div>' +
      '</div>' +
      '<div class="section-title-row"><h4>服务器资源</h4><span class="auto-refresh" id="sysRefreshLabel">5 秒自动刷新</span></div>' +
      '<div id="sysGrid" class="sys-grid"><div class="page-loading"><div class="spinner"></div></div></div>' +
      '<div class="card">' +
        '<div class="card-header"><h3>运行参数</h3></div>' +
        '<table><tbody>' +
          '<tr><td style="width:200px;font-weight:500">限流设置</td><td>每用户每分钟 ' + s.rate_limit_per_minute + ' 次问答</td></tr>' +
          '<tr><td style="font-weight:500">当前状态</td><td><span class="status-dot green"></span>运行正常</td></tr>' +
        '</tbody></table>' +
      '</div>';

    // 启动实时刷新
    loadSysStats();
    if (_sysTimer) clearInterval(_sysTimer);
    _sysTimer = setInterval(() => {
      if (currentPage === 'dashboard') loadSysStats();
      else { clearInterval(_sysTimer); _sysTimer = null; }
    }, 5000);
  } catch (e) {
    area.innerHTML = '<p style="color:var(--danger)">加载失败: ' + esc(e.message) + '</p>';
  }
}

function pctColor(p) {
  if (p >= 85) return 'red';
  if (p >= 65) return 'yellow';
  return 'green';
}

function fmtUptime(sec) {
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (d > 0) return d + ' 天 ' + h + ' 小时';
  if (h > 0) return h + ' 小时 ' + m + ' 分';
  return m + ' 分钟';
}

async function loadSysStats() {
  try {
    const s = await api('/admin/system');
    const grid = document.getElementById('sysGrid');
    if (!grid) return;
    grid.innerHTML =
      '<div class="sys-card">' +
        '<div class="sys-card-title"><span>CPU 使用率</span><span class="sys-card-meta">' + s.cpu.count + ' 核 / ' + (s.cpu.freq_mhz || '?') + ' MHz</span></div>' +
        '<div class="sys-card-value">' + s.cpu.percent + '%</div>' +
        '<div class="sys-card-sub">负载 ' + s.cpu.load_1 + ' / ' + s.cpu.load_5 + ' / ' + s.cpu.load_15 + '</div>' +
        '<div class="sys-progress"><div class="sys-progress-bar ' + pctColor(s.cpu.percent) + '" style="width:' + s.cpu.percent + '%"></div></div>' +
      '</div>' +
      '<div class="sys-card">' +
        '<div class="sys-card-title"><span>内存</span><span class="sys-card-meta">' + s.memory.total_mb + ' MB 总量</span></div>' +
        '<div class="sys-card-value">' + s.memory.percent + '%</div>' +
        '<div class="sys-card-sub">已用 ' + s.memory.used_mb + ' MB · 可用 ' + s.memory.available_mb + ' MB</div>' +
        '<div class="sys-progress"><div class="sys-progress-bar ' + pctColor(s.memory.percent) + '" style="width:' + s.memory.percent + '%"></div></div>' +
      '</div>' +
      '<div class="sys-card">' +
        '<div class="sys-card-title"><span>磁盘</span><span class="sys-card-meta">' + s.disk.total_gb + ' GB 总量</span></div>' +
        '<div class="sys-card-value">' + s.disk.percent + '%</div>' +
        '<div class="sys-card-sub">已用 ' + s.disk.used_gb + ' GB · 剩余 ' + s.disk.free_gb + ' GB</div>' +
        '<div class="sys-progress"><div class="sys-progress-bar ' + pctColor(s.disk.percent) + '" style="width:' + s.disk.percent + '%"></div></div>' +
      '</div>' +
      '<div class="sys-card">' +
        '<div class="sys-card-title"><span>Swap</span><span class="sys-card-meta">' + s.memory.swap_total_mb + ' MB 总量</span></div>' +
        '<div class="sys-card-value">' + s.memory.swap_percent + '%</div>' +
        '<div class="sys-card-sub">已用 ' + s.memory.swap_used_mb + ' MB</div>' +
        '<div class="sys-progress"><div class="sys-progress-bar ' + pctColor(s.memory.swap_percent) + '" style="width:' + s.memory.swap_percent + '%"></div></div>' +
      '</div>' +
      '<div class="sys-card">' +
        '<div class="sys-card-title"><span>进程</span></div>' +
        '<div class="sys-card-value">' + s.process.total + '</div>' +
        '<div class="sys-card-sub">应用占内存 ' + s.process.self_mem_mb + ' MB · CPU ' + s.process.self_cpu_percent + '%</div>' +
      '</div>' +
      '<div class="sys-card">' +
        '<div class="sys-card-title"><span>网络（累计）</span></div>' +
        '<div class="sys-card-value" style="font-size:18px;">↑ ' + s.network.bytes_sent_mb + ' MB</div>' +
        '<div class="sys-card-sub">↓ ' + s.network.bytes_recv_mb + ' MB</div>' +
      '</div>' +
      '<div class="sys-card">' +
        '<div class="sys-card-title"><span>系统运行</span></div>' +
        '<div class="sys-card-value" style="font-size:18px;">' + fmtUptime(s.uptime_seconds) + '</div>' +
        '<div class="sys-card-sub">' + esc(s.platform) + '</div>' +
      '</div>';
  } catch (e) {
    // 静默失败，下次刷新继续尝试
  }
}

/* ─────── Posts (full CRUD) ─────── */
let postsSearch = '';
let postsCurrentPage = 1;

async function renderPosts(page) {
  postsCurrentPage = page;
  selectedPostIds.clear();
  const area = document.getElementById('contentArea');
  try {
    const qs = postsSearch ? '&q=' + encodeURIComponent(postsSearch) : '';
    const d = await api('/admin/posts?page=' + page + '&page_size=15' + qs);
    const totalPages = Math.ceil(d.total / d.page_size) || 1;

    let rows = '';
    for (const p of d.items) {
      rows +=
        '<tr>' +
          '<td><input type="checkbox" class="row-checkbox" data-id="' + p.id + '" onchange="toggleSelectPost(' + p.id + ', this.checked)"></td>' +
          '<td>' + p.id + '</td>' +
          '<td><div class="text-wrap-cell">' + esc(p.content) + '</div></td>' +
          '<td>' + (p.images && p.images.length ? '<span class="badge badge-blue">' + p.images.length + ' 张</span>' : '-') + '</td>' +
          '<td style="white-space:nowrap">' + (p.created_at ? p.created_at.replace('T', ' ').slice(0,19) : '-') + '</td>' +
          '<td>' + (p.category ? '<span class="badge badge-green">' + esc(p.category) + '</span>' : '-') + '</td>' +
          '<td><div class="action-links">' +
            '<a class="action-link-primary" onclick="viewPost(' + p.id + ')">查看</a>' +
            '<a class="action-link-primary" onclick="editPost(' + p.id + ')">编辑</a>' +
            '<a class="action-link-danger" onclick="deletePost(' + p.id + ')">删除</a>' +
          '</div></td>' +
        '</tr>';
    }

    area.innerHTML =
      '<div class="card">' +
        '<div class="card-header">' +
          '<h3>全部贴文 (' + d.total + ')</h3>' +
          '<div class="card-header-actions">' +
            '<div class="search-box">' +
              '<input id="postSearchInput" placeholder="搜索贴文内容..." value="' + esc(postsSearch) + '" onkeydown="if(event.key===\'Enter\')searchPosts()">' +
              '<button class="btn-sm" onclick="searchPosts()">搜索</button>' +
            '</div>' +
            '<button class="btn-accent" onclick="openCreatePostModal()">+ 新建贴文</button>' +
            '<button class="btn-danger-solid hidden" id="batchDeleteBtn" onclick="batchDeletePosts()">批量删除</button>' +
          '</div>' +
        '</div>' +
        '<div style="overflow-x:auto">' +
          '<table>' +
            '<thead><tr>' +
              '<th style="width:40px"><input type="checkbox" class="row-checkbox" onchange="toggleSelectAll(this.checked)"></th>' +
              '<th>ID</th><th>内容</th><th>图片</th><th>发布时间</th><th>分类</th><th>操作</th>' +
            '</tr></thead>' +
            '<tbody>' + (rows || '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-secondary)">暂无数据</td></tr>') + '</tbody>' +
          '</table>' +
        '</div>' +
        '<div class="pagination">' +
          '<span>第 ' + d.page + ' / ' + totalPages + ' 页，共 ' + d.total + ' 条</span>' +
          '<div class="pagination-btns">' +
            '<button ' + (d.page <= 1 ? 'disabled' : '') + ' onclick="renderPosts(' + (d.page - 1) + ')">上一页</button>' +
            '<button ' + (d.page >= totalPages ? 'disabled' : '') + ' onclick="renderPosts(' + (d.page + 1) + ')">下一页</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  } catch (e) {
    area.innerHTML = '<p style="color:var(--danger)">加载失败: ' + esc(e.message) + '</p>';
  }
}

function searchPosts() {
  postsSearch = document.getElementById('postSearchInput').value.trim();
  renderPosts(1);
}

function toggleSelectAll(checked) {
  document.querySelectorAll('tbody .row-checkbox').forEach(function(cb) {
    cb.checked = checked;
    var id = parseInt(cb.dataset.id);
    if (checked) selectedPostIds.add(id);
    else selectedPostIds.delete(id);
  });
  updateBatchBtn();
}

function toggleSelectPost(id, checked) {
  if (checked) selectedPostIds.add(id);
  else selectedPostIds.delete(id);
  updateBatchBtn();
}

function updateBatchBtn() {
  var btn = document.getElementById('batchDeleteBtn');
  if (!btn) return;
  if (selectedPostIds.size > 0) {
    btn.classList.remove('hidden');
    btn.textContent = '批量删除 (' + selectedPostIds.size + ')';
  } else {
    btn.classList.add('hidden');
  }
}

/* ── View post ── */
async function viewPost(id) {
  try {
    const p = await api('/admin/posts/' + id);
    let imagesHtml = '';
    if (p.images && p.images.length) {
      imagesHtml = '<div class="post-images">' +
        p.images.map(function(u) { return '<img src="' + esc(u) + '" onclick="window.open(\'' + esc(u) + '\',\'_blank\')">'; }).join('') +
        '</div>';
    }
    const body =
      '<div class="post-content">' + esc(p.content) + '</div>' +
      imagesHtml +
      '<div class="post-meta">' +
        '<p>发布时间：' + (p.created_at ? p.created_at.replace('T', ' ').slice(0,19) : '未知') + '</p>' +
        (p.category ? '<p>分类：' + esc(p.category) + '</p>' : '') +
      '</div>';
    openModal('贴文 #' + p.id, body, 'view', false);
  } catch (e) {
    showToast('加载失败: ' + e.message, 'error');
  }
}

/* ── Create post ── */
function openCreatePostModal() {
  const body = postFormHtml('', '', '');
  openModal('新建贴文', body, 'create', true);
  editingPostId = null;
}

async function saveNewPost() {
  const content = document.getElementById('formContent').value.trim();
  const images = document.getElementById('formImages').value.trim();
  const category = document.getElementById('formCategory').value.trim();
  if (!content) { showToast('贴文内容不能为空', 'error'); return; }

  const btn = document.getElementById('modalSaveBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';
  try {
    await api('/admin/posts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: content, images: images, category: category }),
    });
    closeModal();
    showToast('贴文创建成功');
    renderPosts(1);
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '保存';
  }
}

/* ── Edit post ── */
async function editPost(id) {
  try {
    const p = await api('/admin/posts/' + id);
    const imagesStr = (p.images || []).join(', ');
    const body = postFormHtml(p.content, imagesStr, p.category || '');
    openModal('编辑贴文 #' + p.id, body, 'edit', true);
    editingPostId = id;
  } catch (e) {
    showToast('加载失败: ' + e.message, 'error');
  }
}

async function saveEditPost() {
  if (!editingPostId) return;
  const content = document.getElementById('formContent').value.trim();
  const images = document.getElementById('formImages').value.trim();
  const category = document.getElementById('formCategory').value.trim();
  if (!content) { showToast('贴文内容不能为空', 'error'); return; }

  const btn = document.getElementById('modalSaveBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';
  try {
    await api('/admin/posts/' + editingPostId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: content, images: images, category: category }),
    });
    closeModal();
    showToast('贴文更新成功');
    renderPosts(postsCurrentPage);
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '保存';
  }
}

/* ── Delete post ── */
async function deletePost(id) {
  if (!confirm('确定要删除贴文 #' + id + ' 吗？此操作不可恢复。')) return;
  try {
    await api('/admin/posts/' + id, { method: 'DELETE' });
    showToast('贴文已删除');
    renderPosts(postsCurrentPage);
  } catch (e) {
    showToast(e.message, 'error');
  }
}

/* ── Batch delete ── */
async function batchDeletePosts() {
  const ids = Array.from(selectedPostIds);
  if (ids.length === 0) return;
  if (!confirm('确定要删除选中的 ' + ids.length + ' 条贴文吗？此操作不可恢复。')) return;
  try {
    const res = await api('/admin/posts/batch-delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: ids }),
    });
    showToast(res.message);
    selectedPostIds.clear();
    renderPosts(postsCurrentPage);
  } catch (e) {
    showToast(e.message, 'error');
  }
}

function postFormHtml(content, images, category) {
  return '<div class="form-field">' +
      '<label>贴文内容 <span style="color:var(--danger)">*</span></label>' +
      '<textarea class="form-textarea" id="formContent" placeholder="请输入贴文内容..." rows="6">' + esc(content) + '</textarea>' +
    '</div>' +
    '<div class="form-field">' +
      '<label>图片链接</label>' +
      '<input class="form-input" id="formImages" value="' + esc(images) + '" placeholder="多张图片用英文逗号分隔">' +
      '<div class="hint">例如: https://example.com/a.jpg, https://example.com/b.jpg</div>' +
    '</div>' +
    '<div class="form-field">' +
      '<label>分类标签</label>' +
      '<input class="form-input" id="formCategory" value="' + esc(category) + '" placeholder="如: 失物招领、二手交易">' +
    '</div>';
}

/* ─────── User Management ─────── */
let usersSearch = '';
let usersStatus = '';

async function renderUsers(page) {
  const area = document.getElementById('contentArea');
  try {
    const qs = (usersSearch ? '&q=' + encodeURIComponent(usersSearch) : '') +
               (usersStatus ? '&status=' + usersStatus : '');
    const d = await api('/admin/users?page=' + page + '&page_size=15' + qs);

    if (d._error) {
      area.innerHTML =

async function saveUserNote(openid) {

    await api('/admin/users/' + encodeURIComponent(openid) + '/note', {
      method: 'PUT',

async function banUser(openid, fromDetail) {
  const reason = prompt('请输入封禁原因（可留空）：', '');
  if (reason === null) return;
  try {
    const res = await api('/admin/users/' + encodeURIComponent(openid) + '/ban', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason }),
    });
    showToast(res.message || '已封禁');
    if (fromDetail) closeModal();
    renderUsers(1);
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function unbanUser(openid, fromDetail) {

    await api('/admin/users/' + encodeURIComponent(openid) + '/unban', { method: 'POST' });
    showToast('已解封');

}

async function kickUser(openid) {

/* ─────── Import ─────── */
let importSelectedFile = null;

function renderImport() {
  const area = document.getElementById('contentArea');
  importSelectedFile = null;

  area.innerHTML =
    '<div class="import-zone" id="importZone">' +
      '<div class="zone-icon">📄</div>' +
      '<div class="zone-title">点击或拖拽上传 CSV 文件</div>' +

      '<input type="file" id="csvFileInput" accept=".csv,.txt" onchange="onFileSelected(event)">' +
      '<div class="import-actions">' +
        '<button class="btn-outline" onclick="downloadTemplate(event)">下载 CSV 模板</button>' +
      '</div>' +
    '</div>' +
    '<div id="fileInfo" class="hidden"></div>' +
    '<div style="text-align:center">' +
      '<button class="btn-upload hidden" id="uploadBtn" onclick="doImport()" disabled>开始导入</button>' +
    '</div>' +
    '<div id="importResult"></div>' +
    '<div class="import-help">' +
      '<h4>CSV 格式说明</h4>' +
      '<table>' +
        '<thead><tr><th>列名</th><th>必填</th><th>说明</th><th>示例</th></tr></thead>' +
        '<tbody>' +
          '<tr><td class="col-name">content</td><td class="col-required">必填</td><td>贴文正文内容</td><td>今天在图书馆捡到一张校园卡</td></tr>' +
          '<tr><td class="col-name">images</td><td class="col-optional">可选</td><td>图片 URL，多张用英文逗号分隔</td><td>https://example.com/a.jpg</td></tr>' +
          '<tr><td class="col-name">created_at</td><td class="col-optional">可选</td><td>发布时间，留空则为当前时间</td><td>2025-01-15 10:30:00</td></tr>' +
          '<tr><td class="col-name">category</td><td class="col-optional">可选</td><td>分类标签</td><td>失物招领</td></tr>' +
        '</tbody>' +
      '</table>' +
    '</div>';

  const zone = document.getElementById('importZone');
  zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', function() { zone.classList.remove('dragover'); });
  zone.addEventListener('drop', function(e) {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
  });
}

function onFileSelected(e) {
  if (e.target.files.length > 0) handleFile(e.target.files[0]);
}

function handleFile(file) {
  if (!file.name.match(/\.(csv|txt)$/i)) { alert('请上传 CSV 格式文件'); return; }
  if (file.size > 10 * 1024 * 1024) { alert('文件大小不能超过 10MB'); return; }

  importSelectedFile = file;
  var sizeStr = file.size < 1024 ? file.size + ' B'
    : file.size < 1024 * 1024 ? (file.size / 1024).toFixed(1) + ' KB'
    : (file.size / (1024 * 1024)).toFixed(1) + ' MB';

  document.getElementById('fileInfo').innerHTML =
    '<div class="file-selected"><span class="file-name">📄 ' + esc(file.name) + '</span>' +
    '<span class="file-size">' + sizeStr + '</span>' +
    '<span class="file-remove" onclick="removeFile()">✕</span></div>';
  document.getElementById('fileInfo').classList.remove('hidden');
  var btn = document.getElementById('uploadBtn');
  btn.classList.remove('hidden');
  btn.disabled = false;
  document.getElementById('importResult').innerHTML = '';
}

function removeFile() {
  importSelectedFile = null;
  document.getElementById('fileInfo').classList.add('hidden');
  document.getElementById('fileInfo').innerHTML = '';
  document.getElementById('uploadBtn').classList.add('hidden');
  document.getElementById('csvFileInput').value = '';
}

function downloadTemplate(e) {
  e.stopPropagation();
  fetch(API_BASE + '/admin/import/template', {
    headers: { 'Authorization': 'Bearer ' + adminToken },
  }).then(function(res) { return res.blob(); }).then(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'import_template.csv';
    a.click();
    URL.revokeObjectURL(url);
  }).catch(function() { alert('下载失败'); });
}

async function doImport() {
  if (!importSelectedFile) return;
  var btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  btn.textContent = '导入中...';
  document.getElementById('importResult').innerHTML =
    '<div class="page-loading" style="padding:30px 0"><div class="spinner"></div> 正在解析并导入数据...</div>';

  try {
    var formData = new FormData();
    formData.append('file', importSelectedFile);
    var res = await fetch(API_BASE + '/admin/import/csv', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + adminToken },
      body: formData,
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.detail || '导入失败');

    var errHtml = '';
    if (data.errors && data.errors.length > 0) {
      errHtml = '<div class="error-list">' +
        data.errors.map(function(e) { return esc(e); }).join('<br>') +
        (data.failed > data.errors.length ? '<br>... 还有 ' + (data.failed - data.errors.length) + ' 条错误未显示' : '') +
        '</div>';
    }

    document.getElementById('importResult').innerHTML =
      '<div class="import-result">' +
        '<h4>导入结果</h4>' +
        '<div class="result-stats">' +
          '<div class="result-stat"><span class="count green">' + data.success + '</span><span>条成功</span></div>' +
          '<div class="result-stat"><span class="count red">' + data.failed + '</span><span>条失败</span></div>' +
        '</div>' +
        errHtml +
      '</div>';
    removeFile();
  } catch (e) {
    document.getElementById('importResult').innerHTML =
      '<div class="import-result"><h4 style="color:var(--danger)">导入失败</h4>' +
      '<p style="margin-top:8px;font-size:14px">' + esc(e.message) + '</p></div>';
  } finally {
    btn.textContent = '开始导入';
    btn.disabled = false;
  }
}

    area.innerHTML = '<p style="color:var(--danger)">加载失败: ' + esc(e.message) + '</p>';
  }
}

/* ── DeepSeek API Key 编辑 ── */
function openEditApiKey() {
  var editorEl = document.getElementById('apikey-editor');
  editorEl.classList.remove('hidden');
  editorEl.innerHTML =
    '<div class="setting-edit-row" style="margin-top:12px">' +
      '<input id="apikey-input" type="password" placeholder="输入新的 DeepSeek API Key（如 sk-xxx...）" style="font-family:monospace">' +
      '<button class="setting-save-btn" onclick="saveApiKey()">保存</button>' +
      '<button class="setting-cancel-btn" onclick="cancelEditApiKey()">取消</button>' +
    '</div>' +
    '<div style="font-size:12px;color:var(--text-secondary);margin-top:8px">' +
      '保存的 Key 仅存于服务端 Redis，前端只显示脱敏值。保存后立即生效。' +
    '</div>';
  document.getElementById('apikey-input').focus();
}

function cancelEditApiKey() {
  var el = document.getElementById('apikey-editor');
  el.classList.add('hidden');
  el.innerHTML = '';
}

async function saveApiKey() {
  var inputEl = document.getElementById('apikey-input');
  var val = inputEl.value.trim();
  if (!val) { showToast('API Key 不能为空', 'error'); return; }
  if (val.length < 10) { showToast('API Key 看起来不正确', 'error'); return; }

  try {
    await api('/admin/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ deepseek_api_key: val }),
    });
    showToast('API Key 已更新并生效');
    renderSettings();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function resetApiKey() {
  if (!confirm('确定要恢复为 .env 中的默认 API Key 吗？')) return;
  try {
    await api('/admin/settings/deepseek_api_key', { method: 'DELETE' });
    showToast('已恢复默认 API Key');
    renderSettings();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function saveSystemPrompt() {
  const val = (document.getElementById('sysPromptInput').value || '').trim();
  if (val.length < 5) { showToast('提示词过短', 'error'); return; }
  if (val.length > 4000) { showToast('提示词过长', 'error'); return; }
  try {
    await api('/admin/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system_prompt: val }),
    });
    showToast('系统提示词已更新并立即生效');
    renderSettings();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function resetSystemPrompt() {
  if (!confirm('确定要恢复为代码内置的默认提示词吗？当前自定义会被删除。')) return;
  try {
    await api('/admin/settings/system_prompt', { method: 'DELETE' });
    showToast('已恢复默认提示词');
    renderSettings();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function testApiKey() {
  showToast('正在测试 API Key...', 'warning');
  try {
    const res = await api('/admin/settings/test-api-key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
    });
    if (res.ok) {
      showToast('✓ ' + res.message + '（' + res.model + '）');
    } else {
      showToast('✗ ' + res.message, 'error');
    }
  } catch (e) {
    showToast(e.message, 'error');
  }
}

function startEditSetting(key, type) {
  var currentVal = settingsCache[key];
  var editorEl = document.getElementById('setting-editor-' + key);
  editorEl.classList.remove('hidden');
  editorEl.innerHTML =
    '<div class="setting-edit-row">' +
      '<input id="setting-input-' + key + '" type="' + (type || 'text') + '" value="' + esc(String(currentVal)) + '">' +
      '<button class="setting-save-btn" onclick="saveSetting(\'' + key + '\', \'' + type + '\')">保存</button>' +
      '<button class="setting-cancel-btn" onclick="cancelEditSetting(\'' + key + '\')">取消</button>' +
    '</div>';
  document.getElementById('setting-input-' + key).focus();
}

function cancelEditSetting(key) {
  document.getElementById('setting-editor-' + key).classList.add('hidden');
  document.getElementById('setting-editor-' + key).innerHTML = '';
}

async function saveSetting(key, type) {
  var inputEl = document.getElementById('setting-input-' + key);
  var val = inputEl.value.trim();
  if (!val) { showToast('设置值不能为空', 'error'); return; }

  var payload = {};
  payload[key] = type === 'number' ? parseInt(val) : val;

  try {
    await api('/admin/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    showToast('设置已更新');
    renderSettings();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

/* ─────── Helpers ─────── */
function esc(s) {
  if (s == null) return '';
  var d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function num(n) {
  return (n || 0).toLocaleString();
}
</script>
