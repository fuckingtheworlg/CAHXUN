<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CampusPulse AI Q&amp;A</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=Manrope:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#727975",
                        "surface-container-high": "#e7e8e9",
                        "inverse-surface": "#2e3132",
                        "primary": "#001610",
                        "outline-variant": "#c1c8c4",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#cfc5b6",
                        "surface": "#f8f9fa",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f0f1f2",
                        "secondary-fixed-dim": "#a1d0c1",
                        "on-surface-variant": "#414845",
                        "tertiary": "#161209",
                        "inverse-primary": "#adcec1",
                        "surface-variant": "#e1e3e4",
                        "secondary": "#3a675a",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-dim": "#d9dadb",
                        "secondary-fixed": "#bceddd",
                        "primary-container": "#0d2c24",
                        "on-tertiary-fixed": "#201b12",
                        "error": "#ba1a1a",
                        "surface-container": "#edeeef",
                        "surface-tint": "#46645b",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#bceddd",
                        "tertiary-container": "#2b261c",
                        "primary-fixed": "#c8eadd",
                        "on-primary-fixed-variant": "#2f4c43",
                        "on-background": "#191c1d",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "background": "#f8f9fa",
                        "on-secondary-container": "#406d60",
                        "on-tertiary-fixed-variant": "#4c463b",
                        "on-surface": "#191c1d",
                        "tertiary-fixed": "#ece1d2",
                        "surface-bright": "#f8f9fa",
                        "primary-fixed-dim": "#adcec1",
                        "on-tertiary-container": "#958d7f",
                        "surface-container-highest": "#e1e3e4",
                        "on-secondary-fixed-variant": "#214e43",
                        "on-primary-fixed": "#012019",
                        "on-primary-container": "#75958a",
                        "surface-container-low": "#f3f4f5",
                        "on-secondary-fixed": "#002019"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "container-padding": "20px",
                        "gutter": "16px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "meta-sm": ["Inter"],
                        "headline-md": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Manrope"],
                        "label-caps": ["JetBrains Mono"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "meta-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glowing-avatar {
            box-shadow: 0 0 20px rgba(13, 44, 36, 0.2);
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(13, 44, 36, 0.1); }
            50% { box-shadow: 0 0 30px rgba(13, 44, 36, 0.3); }
            100% { box-shadow: 0 0 15px rgba(13, 44, 36, 0.1); }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim bg-surface-container-low dark:bg-surface-container-lowest">
<div class="flex items-center justify-between px-container-padding h-16 w-full max-w-7xl mx-auto">
<button class="text-primary dark:text-primary-fixed hover:bg-surface-variant/50 transition-colors active:scale-95 duration-100 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">CampusPulse</h1>
<button class="text-primary dark:text-primary-fixed hover:bg-surface-variant/50 transition-colors active:scale-95 duration-100 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center pt-24 pb-32 px-container-padding max-w-3xl mx-auto w-full">
<!-- AI Assistant Hero -->
<div class="flex flex-col items-center mb-stack-lg w-full text-center">
<div class="w-24 h-24 rounded-full bg-surface-container-high flex items-center justify-center mb-stack-md glowing-avatar border border-outline-variant">
<span class="material-symbols-outlined text-primary-container text-5xl" style="font-variation-settings: &quot;FILL&quot; 1;">smart_toy</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-primary-container mb-stack-sm">您好！我是您的校园问答助手</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">无论您有关于课程、校园活动还是设施的任何疑问，我都在这里为您解答。</p>
</div>
<!-- Suggested Questions Cards -->
<div class="w-full flex flex-col gap-stack-md mb-stack-lg">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider pl-2">您可能会问：</p>
<button class="flex items-center gap-4 bg-surface-container-lowest border border-outline-variant/30 p-5 rounded-xl hover:bg-surface-container-low transition-colors shadow-sm text-left group">
<div class="w-10 h-10 rounded-full bg-secondary-container/30 flex items-center justify-center flex-shrink-0 group-hover:bg-secondary-container/50 transition-colors">
<span class="material-symbols-outlined text-primary-container">calendar_month</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-primary-container text-[16px] leading-[22px]">下周有什么重要的校园活动吗？</h3>
</div>
</button>
<button class="flex items-center gap-4 bg-surface-container-lowest border border-outline-variant/30 p-5 rounded-xl hover:bg-surface-container-low transition-colors shadow-sm text-left group">
<div class="w-10 h-10 rounded-full bg-secondary-container/30 flex items-center justify-center flex-shrink-0 group-hover:bg-secondary-container/50 transition-colors">
<span class="material-symbols-outlined text-primary-container">menu_book</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-primary-container text-[16px] leading-[22px]">图书馆三楼的开放时间是什么？</h3>
</div>
</button>
<button class="flex items-center gap-4 bg-surface-container-lowest border border-outline-variant/30 p-5 rounded-xl hover:bg-surface-container-low transition-colors shadow-sm text-left group">
<div class="w-10 h-10 rounded-full bg-secondary-container/30 flex items-center justify-center flex-shrink-0 group-hover:bg-secondary-container/50 transition-colors">
<span class="material-symbols-outlined text-primary-container">restaurant</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-primary-container text-[16px] leading-[22px]">今天南区食堂有什么特色菜？</h3>
</div>
</button>
</div>
</main>
<!-- Fixed Bottom Chat Input -->
<div class="fixed bottom-[72px] md:bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant/20 z-40">
<div class="max-w-3xl mx-auto px-container-padding py-4 flex items-end gap-3">
<button class="p-3 text-on-surface-variant hover:text-primary transition-colors flex-shrink-0 bg-surface-container-low rounded-xl">
<span class="material-symbols-outlined">image</span>
</button>
<div class="flex-grow bg-[#F1F3F5] rounded-xl border border-transparent focus-within:border-primary-container focus-within:bg-surface-container-lowest transition-all overflow-hidden flex items-center">
<textarea class="w-full bg-transparent border-none focus:ring-0 resize-none font-body-md text-body-md text-on-surface py-3 px-4 max-h-32" placeholder="在此输入您的问题..." rows="1" style="min-height: 44px;"></textarea>
</div>
<button class="bg-primary-container text-on-primary hover:bg-primary transition-colors px-6 py-3 rounded-xl font-label-caps text-label-caps flex-shrink-0 flex items-center gap-2 h-[44px]">
<span class="">发送</span>
<span class="material-symbols-outlined text-sm">send</span>
</button>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 bg-surface dark:bg-surface-dim shadow-sm z-50 md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all active:scale-90 duration-150 rounded-lg">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-caps text-label-caps text-[10px] mt-1">首页</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all active:scale-90 duration-150 rounded-lg">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="font-label-caps text-label-caps text-[10px] mt-1">搜索</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full px-4 py-1 hover:bg-surface-container-high transition-all active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="smart_toy" style="font-variation-settings: &quot;FILL&quot; 1;">smart_toy</span>
<span class="font-label-caps text-label-caps text-[10px] mt-1">AI问答</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all active:scale-90 duration-150 rounded-lg">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-caps text-label-caps text-[10px] mt-1">我的</span>
</button>
</nav>


</body></html>
