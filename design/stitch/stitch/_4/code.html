<script>
      // Subtle parallax effect on profile image hover
      const profileContainer = document.querySelector('.w-32.h-32');
      if (profileContainer) {
        profileContainer.addEventListener('mousemove', (e) => {
          const { left, top, width, height } = profileContainer.getBoundingClientRect();
          const x = (e.clientX - left) / width - 0.5;
          const y = (e.clientY - top) / height - 0.5;
          
          profileContainer.querySelector('img').style.transform = `scale(1.1) translate(${x * 10}px, ${y * 10}px)`;
        });
        
        profileContainer.addEventListener('mouseleave', () => {
          profileContainer.querySelector('img').style.transform = `scale(1) translate(0, 0)`;
        });
      }

      // Ripple-like effect for action buttons
      document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const ripple = document.createElement('div');
          ripple.classList.add('absolute', 'bg-white/30', 'rounded-full', 'pointer-events-none');
          ripple.style.width = ripple.style.height = '10px';
          const rect = this.getBoundingClientRect();
          ripple.style.left = `${e.clientX - rect.left}px`;
          ripple.style.top = `${e.clientY - rect.top}px`;
          ripple.style.transform = 'scale(0)';
          ripple.style.transition = 'transform 0.5s ease-out, opacity 0.5s';
          this.style.position = 'relative';
          this.style.overflow = 'hidden';
          this.appendChild(ripple);
          
          requestAnimationFrame(() => {
            ripple.style.transform = 'scale(20)';
            ripple.style.opacity = '0';
          });
          
          setTimeout(() => ripple.remove(), 500);
        });
      });
    </script>
